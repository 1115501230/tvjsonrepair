    function showStatus(msg, type) {
        const status = document.getElementById('status');
        status.className = 'status ' + type;
        status.textContent = msg;
    }

    function getDateStr() {
        const now = new Date();
        return now.getFullYear() + '-' + 
            String(now.getMonth() + 1).padStart(2, '0') + '-' + 
            String(now.getDate()).padStart(2, '0');
    }

    async function fetchJSON(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error('获取失败: ' + url);
        return response.json();
    }

    async function mergeAndDownload() {
        const btn = document.getElementById('mergeBtn');
        const output = document.getElementById('output');
        btn.disabled = true;
        btn.textContent = '处理中...';
        output.textContent = '';

        try {
            showStatus('开始合并...', 'info');

            // 合并sites数据
            let successCount = 0;
            let failCount = 0;
            for (const source of siteSources) {
                try {
                    const data = await fetchJSON(source);
                    if (Array.isArray(data)) {
                        template.sites = template.sites.concat(data);
                        successCount++;
                    }
                } catch (e) {
                    failCount++;
                    console.warn('跳过 ' + source + ': ' + e.message);
                }
            }
            showStatus(`sites合并完成: ${successCount}个成功, ${failCount}个失败 (详见控制台)`, failCount > 0 ? 'error' : 'success');

            // 合并parses数据
            successCount = 0;
            failCount = 0;
            for (const source of parseSources) {
                try {
                    const data = await fetchJSON(source);
                    if (Array.isArray(data)) {
                        template.parses = template.parses.concat(data);
                        successCount++;
                    }
                } catch (e) {
                    failCount++;
                    console.warn('跳过 ' + source + ': ' + e.message);
                }
            }
            showStatus(`parses合并完成: ${successCount}个成功, ${failCount}个失败 (详见控制台)`, failCount > 0 ? 'error' : 'success');

            const jsonStr = JSON.stringify(template, null, 2);
            output.textContent = jsonStr;

            // 下载文件
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'yqx-' + getDateStr() + '.json';
            a.click();
            URL.revokeObjectURL(url);

            showStatus('合并完成！已下载 yqx-' + getDateStr() + '.json', 'success');
        } catch (e) {
            showStatus('错误: ' + e.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '合并并下载JSON';
        }
    }

    document.getElementById('mergeBtn').addEventListener('click', mergeAndDownload);
